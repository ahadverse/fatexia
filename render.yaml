# Render Blueprint — the whole backend in one file.
#
# The backend is TWO processes, not one (see PLAN-tracker.md): the API that the
# portals talk to, and the Tracker that serves click redirects. They are deployed as
# separate services from the same repository so a traffic spike on /click can never
# slow down the admin panel, and so each can be scaled and restarted independently.
#
# Apply with: Render dashboard → New → Blueprint → point at this repo.

# No `databases:` block on purpose. Postgres is hosted on Neon, not Render, so
# DATABASE_URL is a secret pasted into both services (`sync: false`) rather than a
# `fromDatabase` reference. Render's free Postgres expires after 90 days with no
# backups; this database holds every click, conversion and payout.
#
# Both services must be given the SAME Neon connection string, and it must be the
# POOLED one (`-pooler` in the host). See DEPLOYMENT.md.

services:
  # ---------------------------------------------------------------------------
  # Redis. Backs the proxy-detection cache and its per-provider quota counters.
  # Without it the fraud cascade fails closed per provider (skips, never blocks).
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: fatexia-redis
    plan: free
    ipAllowList: []          # private network only — never reachable from outside
    maxmemoryPolicy: noeviction

  # ---------------------------------------------------------------------------
  # Main API — REST + Socket.IO, consumed by the Admin and Affiliate portals.
  # ---------------------------------------------------------------------------
  - type: web
    name: fatexia-api
    runtime: node
    # Free while the deployment is being wired up. Free web services sleep after
    # ~15 minutes idle and take up to a minute to wake, so the first admin request
    # after a quiet spell is slow — acceptable for a panel, not for redirects.
    plan: free
    rootDir: backend
    # `--include=dev` is required, not optional. NODE_ENV=production is set below and
    # Render exposes env vars during the build, so a plain `npm ci` would omit
    # devDependencies — and `typescript` (for `npm run build`) and `tsx` (for
    # `seed:prod`) both live there. Without it the build fails on "tsc: not found".
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run at start, not during build, because the build step has no
    # access to the database on Render. `migration:run` is idempotent — already
    # applied migrations are skipped — so re-running on every boot is safe.
    startCommand: npm run migration:run:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Neon pooled connection string. Not generated by Render — paste it in.
      - key: DATABASE_URL
        sync: false
      # Neon terminates every connection with TLS. Set explicitly rather than relying
      # on `?sslmode=require` in the URL — see data-source.ts.
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          name: fatexia-redis
          type: keyvalue
          property: connectionString
      # Generated once by Render and never shown in the repo. Rotating either one
      # invalidates every existing session, which is the intended behaviour.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Express sits behind Render's proxy, so req.ip must come from the forwarded
      # header — otherwise every login is attributed to the proxy's own address.
      #
      # The HOP COUNT, never "true". With "true" Express walks the whole
      # X-Forwarded-For chain and takes the left-most entry, which is entirely
      # client-supplied.
      #
      # This is "3", not "1" — verified against a real production request's
      # X-Forwarded-For chain: "<client>, <Cloudflare edge>, <Render's internal
      # router>". Both this domain and the tracker's are Cloudflare-proxied before
      # reaching Render, so there are three hops in front of the app (Cloudflare +
      # Render's router + the direct internal connection into the container), not
      # one. "1" was resolving req.ip to Render's own internal address.
      - key: TRUST_PROXY
        value: "3"
      # Must list every browser origin that calls this API. The app refuses to boot
      # in production with this empty rather than silently allowing any origin.
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_TRACKING_URL
        sync: false
      # No GEOIP_DB_DIR/MAXMIND_LICENSE_KEY here — this service never reads the
      # .mmdb files. Only the Tracker's click path calls geoSource.lookup(); the API
      # only imports pure helpers (normalizeIp/isPrivateOrLoopback) from that module.
      # No IPHUB_API_KEY/IPAPI_IS_API_KEY/IPQS_API_KEY here on purpose. Those are
      # runtime credentials entered in the Admin portal under Integrations and read
      # from the database — see integration-credentials.ts. Setting them here as well
      # would give an operator two places to look, and one would eventually be stale.
      #
      # This service DOES need GEOIP_ADMIN_SECRET even though it never downloads
      # anything itself: /geoip/fetch (admin-guarded) forwards the request to the
      # Tracker's /internal/geoip/fetch with this header — see
      # modules/geoip/geoip.service.ts. Must be the identical value on both services.
      - key: GEOIP_ADMIN_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Tracker — the public /click redirect path.
  #
  # >>> MUST BE MOVED TO `starter` BEFORE ANY REAL CLICK TRAFFIC. <<<
  #
  # Free services sleep after ~15 minutes of inactivity and take up to a minute to
  # wake. A click redirect that stalls that long is a lost conversion and, at volume,
  # a lost advertiser relationship. Free is only tolerable right now because nothing
  # can convert yet — /sl and /postback are not built, so no affiliate is sending
  # traffic. The day that changes, this line has to change with it.
  # ---------------------------------------------------------------------------
  - type: web
    name: fatexia-tracker
    runtime: node
    plan: free
    rootDir: backend
    # `--include=dev` is required, not optional. NODE_ENV=production is set below and
    # Render exposes env vars during the build, so a plain `npm ci` would omit
    # devDependencies — and `typescript` (for `npm run build`) and `tsx` (for
    # `seed:prod`) both live there. Without it the build fails on "tsc: not found".
    buildCommand: npm ci --include=dev && npm run build
    # No migrations here — the API service owns the schema. Two services racing to
    # migrate the same database on a simultaneous deploy is how you get a half
    # applied migration.
    startCommand: npm run start:tracking
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # No port variables here on purpose. Render injects PORT, and TRACKING_PORT
      # falls back to it (see env.ts) — so the Tracker binds whatever Render routes
      # to, without this file having to hardcode Render's internal default.
      # The SAME Neon pooled connection string as the API service.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          name: fatexia-redis
          type: keyvalue
          property: connectionString
      # The tracker never validates a JWT — it serves /click redirects and
      # server-to-server postbacks. These are here because env.ts runs
      # assertSecureProductionSecrets() at module load, and tracking.ts imports env,
      # so without them the service dies at boot with "Refusing to start in
      # production with missing or default secret(s)".
      #
      # Pulled from the API rather than generated separately: two independently
      # generated pairs would work today only because nothing here reads a token, and
      # would break silently the moment /postback needs to.
      - key: JWT_ACCESS_SECRET
        fromService:
          name: fatexia-api
          type: web
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          name: fatexia-api
          type: web
          envVarKey: JWT_REFRESH_SECRET
      # The hop count, not "true" — and it matters more here than on the API. req.ip
      # on this service feeds the geo lookup, the stored click row and the
      # datacenter/ASN fraud score. Trusting the full X-Forwarded-For chain would let
      # an affiliate pick their own country and score their own traffic clean just by
      # sending a header on the click URL.
      #
      # "3", matching the API service — see that service's TRUST_PROXY comment for
      # how this was verified against a real production X-Forwarded-For chain.
      - key: TRUST_PROXY
        value: "3"
      # The tracker serves 302 redirects and server-to-server postbacks, never
      # browser fetches, so it needs no CORS allowlist. It still needs a non-empty
      # value because the production guard checks it unconditionally.
      - key: CORS_ORIGIN
        sync: false
      # PUBLIC_TRACKING_URL is deliberately absent here. Only the API builds tracking
      # links (offer.dto.ts, smart-link.dto.ts); the tracker just serves /click and
      # never needs to know its own public address.
      #
      # GEOIP_DB_DIR/MAXMIND_LICENSE_KEY: never fetched automatically — neither at
      # build time nor at boot (see infra/geoip/ensure-geoip.ts). Both approaches used
      # to re-download on every single deploy/restart against Render's ephemeral
      # filesystem and eventually hit MaxMind's rate limit. Instead an admin triggers
      # POST /geoip/fetch from the Admin panel on demand, which lands here at
      # /internal/geoip/fetch. Without a persistent Disk mounted at this path (not yet
      # attached — requires a paid plan), a restart still wipes the files and geo/ASN
      # degrade to unknown until the next manual trigger — same graceful degradation
      # as a missing file always had.
      - key: GEOIP_DB_DIR
        value: data/geoip
      - key: MAXMIND_LICENSE_KEY
        sync: false
      # Shared secret checked by /internal/geoip/* — see geoip-internal.routes.ts.
      # Must be the identical value entered on the API service above.
      - key: GEOIP_ADMIN_SECRET
        sync: false
      # Provider keys are entered in the Admin portal, not here — see the note on the
      # API service above.
